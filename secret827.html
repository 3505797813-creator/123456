<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>星际闯关大冒险</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0b0b2b;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
            font-family: Arial;
            color: white;
        }
        #gameCanvas {
            border: 4px solid #44aaff;
            border-radius: 8px;
            background: #101040;
        }
        .info{
            font-size: 22px;
            margin-bottom:10px;
        }
    </style>
</head>
<body>
    <div class="info">分数：<span id="score">0</span></div>
    <canvas id="gameCanvas" width="700" height="500"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreText = document.getElementById("score");

        //玩家
        let player = {
            x: 330,
            y: 450,
            w:40,
            h:40,
            speed:7
        };
        let score = 0;
        let enemies = [];
        let stars = [];
        let keys = {};

        //监听按键
        window.addEventListener("keydown",e=>{keys[e.key]=true;})
        window.addEventListener("keyup",e=>{keys[e.key]=false;})

        //生成敌人
        function spawnEnemy(){
            enemies.push({
                x: Math.random()*(canvas.width-40),
                y:-40,
                size:35,
                speed: 3+Math.random()*3
            })
        }
        //生成星星
        function spawnStar(){
            stars.push({
                x: Math.random()*(canvas.width-30),
                y:-30,
                size:25,
                speed: 2+Math.random()*2
            })
        }

        //碰撞检测
        function hit(a,b){
            return a.x < b.x + b.size &&
                   a.x + a.w > b.x &&
                   a.y < b.y + b.size &&
                   a.y + a.h > b.y
        }

        //游戏循环
        function loop(){
            //移动玩家
            if(keys["ArrowLeft"] && player.x>0) player.x -= player.speed;
            if(keys["ArrowRight"] && player.x+player.w<canvas.width) player.x += player.speed;

            //随机生成
            if(Math.random()<0.025) spawnEnemy();
            if(Math.random()<0.018) spawnStar();

            //更新敌人
            for(let i=enemies.length-1;i>=0;i--){
                let e = enemies[i];
                e.y += e.speed;
                if(hit(player,e)){
                    alert("游戏结束！你的得分："+score);
                    score=0;
                    enemies=[];
                    stars=[];
                    player.x=330;
                }
                if(e.y>canvas.height) enemies.splice(i,1);
            }

            //更新星星
            for(let i=stars.length-1;i>=0;i--){
                let s = stars[i];
                s.y += s.speed;
                if(hit(player,s)){
                    score += 10;
                    scoreText.innerText=score;
                    stars.splice(i,1);
                }
                if(s.y>canvas.height) stars.splice(i,1);
            }

            //绘制画面
            ctx.clearRect(0,0,canvas.width,canvas.height);

            //玩家方块
            ctx.fillStyle="#ff3333";
            ctx.fillRect(player.x,player.y,player.w,player.h);

            //敌人
            ctx.fillStyle="#3399ff";
            enemies.forEach(e=>{
                ctx.beginPath();
                ctx.arc(e.x,e.y,e.size/2,0,Math.PI*2);
                ctx.fill();
            })

            //星星
            ctx.fillStyle="#ffdd00";
            stars.forEach(s=>{
                ctx.beginPath();
                ctx.arc(s.x,s.y,s.size/2,0,Math.PI*2);
                ctx.fill();
            })

            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
